name: Backend CI

on:
  push:
    paths:
      - "Backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "Backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (light)
        run: |
          ruff check app.py plant_recommend.py tests \
            --select E9,F63,F7,F82 \
            --ignore E501

      - name: Pytest
        env:
          PLANT_DATA_PATH: fixtures/plants_sample.csv
          AUTO_INIT: "true"
        run: pytest -q
